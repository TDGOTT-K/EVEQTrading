[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eveqtrading"
version = "0.1.0"
description = "Traced EVE Online market analysis foundation for AI-operated workflows."
requires-python = ">=3.9"
authors = [
  { name = "Codex" }
]
dependencies = [
  "PyJWT[crypto]>=2.10.1",
]

[project.scripts]
eveq = "eveqtrading.cli:main"
eve-sso = "eve_sso_core.cli:main"
eve-esi = "eve_esi_client.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
